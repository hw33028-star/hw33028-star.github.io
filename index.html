<!DOCTYPE html>

<head>

    * { box-sizing: border-box; }

      border-radius: 9999px;

    }
    .progress {
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
    }
    .question-title {

      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 24px;
      white-space: pre-wrap;

    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;

    .option-label:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;

    }
    .input-text {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 24px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-text:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 13px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

      flex: 2;
      background: #2563eb;
      color: #ffffff;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
    .btn-nav {
      flex: 1;
      background: #f1f5f9;
      color: #334155;
    }
    .btn-nav:hover {
      background: #e2e8f0;

      border-radius: 10px;
      font-size: 20px;
      font-weight: 800;
      text-align: center;

      color: #166534;

  let currentIndex = 0;

  function renderQuestion() {
    const q = questions[currentIndex];
    document.getElementById("categoryBadge").innerText = q.category;
    document.getElementById("progressText").innerText = `第 ${currentIndex + 1} 題 / 共 ${questions.length} 題`;
    document.getElementById("qText").innerText = q.title;

    document.getElementById("statusBox").style.display = "none";
    document.getElementById("explBox").style.display = "none";

    const area = document.getElementById("interactiveArea");
    area.innerHTML = "";

    if (q.type === "choice") {
      const optContainer = document.createElement("div");
      optContainer.className = "options";
      q.options.forEach(opt => {
        const label = document.createElement("label");
        label.className = "option-label";
        const val = opt.trim().charAt(0);
        label.innerHTML = `<input type="radio" name="quizOpt" value="${val}"> ${opt}`;
        optContainer.appendChild(label);
      });
      area.appendChild(optContainer);
    } else {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "input-text";
      input.id = "userTextInput";
      input.placeholder = "請輸入計算結果後點擊判定...";
      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") checkAnswer();
      });
      area.appendChild(input);
      input.focus();
    }
  }

  function checkAnswer() {
    const q = questions[currentIndex];
    let userAns = "";

    if (q.type === "choice") {
      const selected = document.querySelector('input[name="quizOpt"]:checked');
      if (!selected) {
        alert("請先選擇一個選項！");
        return;
      }
      userAns = selected.value.trim().toUpperCase();
    } else {
      const textInput = document.getElementById("userTextInput");
      if (!textInput || !textInput.value.trim()) {
        alert("請先輸入計算結果！");
        return;
      }
      userAns = textInput.value.trim().toUpperCase();
    }

    const cleanUser = userAns.replace(/[^A-Z0-9]/g, "");
    const cleanCorrect = q.answer.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");

    const isMatch = (cleanUser === cleanCorrect);
    const statusBox = document.getElementById("statusBox");
    const explBox = document.getElementById("explBox");

    statusBox.style.display = "block";
    explBox.style.display = "block";

    if (isMatch) {
      statusBox.className = "status-banner status-true";
      statusBox.innerText = "TRUE";
    } else {
      statusBox.className = "status-banner status-wrong";
      statusBox.innerText = `WRONG (正確答案: ${q.answer})`;
    }

    explBox.innerText = "【解題分析與步驟】\n" + q.explanation;
  }

  function nextQuestion() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      alert("太棒了！已全部完成 C1 題庫！");
    }
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  renderQuestion();
</script>
